name = "nhl-trade-tracker"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Poll for news every 2 minutes.
[triggers]
crons = ["*/2 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "nhl-trade-tracker"
# Replace with the id printed by: npx wrangler d1 create nhl-trade-tracker
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[observability]
enabled = true
