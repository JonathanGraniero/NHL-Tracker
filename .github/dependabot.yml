# Weekly version updates. Security updates for vulnerable dependencies come
# separately, as soon as an advisory is published (enabled in the repo settings).
# Cooldown: skip releases younger than a week, so a hijacked release is
# usually caught and pulled before it reaches a pull request here.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
